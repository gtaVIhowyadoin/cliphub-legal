<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ClipHub sign-in</title>
<style>
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; background: #f5f5f7; color: #1d1d1f;
         display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 0 16px; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f7; } }
  p { max-width: 32em; text-align: center; }
</style>
</head>
<body>
<p id="msg">Finishing sign-in… returning you to ClipHub on this computer.</p>
<script>
  // Instagram and TikTok only accept HTTPS sign-in return addresses, so they come here first.
  // This page passes the one-time sign-in code straight back to ClipHub on this same computer.
  // It stores nothing and sends nothing anywhere else.
  (function () {
    var q = new URLSearchParams(location.search);
    var platform = (q.get('state') || '').split('.')[0];
    if (['instagram', 'tiktok', 'youtube'].indexOf(platform) === -1) {
      document.getElementById('msg').textContent = 'This page only finishes ClipHub sign-ins. Start from ClipHub → Settings → Connect.';
      return;
    }
    location.replace('http://localhost:8787/api/auth/' + platform + '/callback' + location.search);
  })();
</script>
</body>
</html>
